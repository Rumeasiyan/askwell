# Askwell — the local stack.
#
# One user, one machine. There is no operator, no second node and no
# orchestrator: this runs on somebody's laptop, which is also running their
# browser. Every service here is something a non-technical person has to have
# working unaided, which is why the API reports each of them separately rather
# than as one boolean (see api/src/askwell/health.py).
#
#   podman compose up -d          bring it up
#   podman compose logs -f api    watch one service
#   podman compose down           stop, keeping data
#   podman compose down -v        stop and destroy the data. There is no undo.
#
# Not here yet, deliberately: voice (M6), and native inference, which runs as a
# host process rather than a container because it needs the GPU.
#
# C1 is enforced by the network topology, not by asking nicely. Every service
# except the proxy sits on an `internal` network, which has no route off this
# machine — so a container that ignores HTTP_PROXY does not find another way
# out, it finds nothing. The proxy is the only service on both networks, and it
# refuses everything.
#
# `sandbox` (M4, C3) sits on its own `sandbox` network, joined only by `api`
# and `worker`. It is not on `internal` and not on `egress`: an imported dump
# is untrusted code, so the database it loads into has no path to Askwell's
# own database and no path to the proxy, let alone the internet. See
# `docs/data-sources.md` §3.

name: askwell

services:
  postgres:
    # pgvector's own image, which is Postgres with the extension already built.
    # Building it into the stock image would mean a compiler in the runtime
    # image and a build step on every user's machine.
    image: docker.io/pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and set it. It is never committed (C8).}
      POSTGRES_DB: ${POSTGRES_DB:-askwell}
      # Askwell's own data lives in a subdirectory of the volume so that the
      # volume can also hold anything else the database needs later without
      # Postgres refusing to initialise into a non-empty directory.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Read by the initialisation hook below, not by Postgres itself.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is not set. Copy .env.example to .env and set it (C8).}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-${POSTGRES_APP_PASSWORD}}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, and creates the two non-owner
      # roles. Askwell must not connect as the table owner: an owner bypasses
      # its own grants, which would leave the audit log's append-only guarantee
      # looking correct and doing nothing (C6).
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # -U and -d matter: the default `pg_isready` asks about a database named
      # after the current user, which reports healthy while the database the
      # application actually connects to is still being created on first boot.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askwell} -d ${POSTGRES_DB:-askwell}"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Postgres restarts itself once during first-boot initialisation, and
      # accepts connections briefly in between. Without a start period the
      # dependents connect into that window and are dropped.
      start_period: 10s
    # No ports. Nothing outside the stack talks to the database, and publishing
    # it would put an open Postgres on the machine's network interface.
    networks: [internal]
    restart: unless-stopped

  sandbox:
    # Same image as `postgres` deliberately — one thing to bundle, update and
    # learn (`docs/architecture.md` §1). It is a second *instance*, not a
    # second schema in the first one: C3 requires that a hostile dump be able
    # to wreck only its own database, and a shared instance with the chunks,
    # memory and audit log would make that untrue no matter how the roles
    # inside it are configured.
    image: docker.io/pgvector/pgvector:pg18
    environment:
      # The instance superuser. Used only by `askwell.sandbox`'s control
      # plane — `CREATE DATABASE` / `DROP DATABASE` cannot run as a role that
      # owns nothing, and cannot run inside a transaction, so it is not the
      # role dump content ever executes as. Dump content runs as
      # `askwell_sandbox_owner`, created by the init script below with no
      # `CREATEDB`, so a dump cannot use this connection's privilege to make
      # itself a second database to hide in.
      POSTGRES_USER: ${SANDBOX_POSTGRES_USER:-askwell_sandbox}
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD:?SANDBOX_POSTGRES_PASSWORD is not set. Copy .env.example to .env and set it. It is never committed (C8).}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Read by the init script below, not by Postgres itself.
      SANDBOX_OWNER_PASSWORD: ${SANDBOX_OWNER_PASSWORD:?SANDBOX_OWNER_PASSWORD is not set. Copy .env.example to .env and set it (C8).}
      SANDBOX_READONLY_PASSWORD: ${SANDBOX_READONLY_PASSWORD:?SANDBOX_READONLY_PASSWORD is not set. Copy .env.example to .env and set it (C8).}
    volumes:
      # Its own volume. `docs/data-sources.md` §3's per-import cap
      # (`M4-DUMP-VAL-089`) is what actually bounds it; a separate volume is
      # what makes that cap possible to apply without also capping the chunks,
      # memory and audit log sharing the main one.
      - sandbox-data:/var/lib/postgresql/data
      # Locks PUBLIC's default CONNECT and large-object privileges down once,
      # instance-wide, so every database `askwell.sandbox` creates afterwards
      # inherits "nobody can reach this" rather than needing to be locked down
      # one at a time. See `deploy/sandbox/10-roles.sh`.
      - ./deploy/sandbox:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_POSTGRES_USER:-askwell_sandbox} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    # No ports, same reasoning as `postgres`. Reachable only from `api` and
    # `worker`, which are the only other services on this network.
    networks: [sandbox]
    restart: unless-stopped

  redis:
    image: docker.io/redis:8-alpine
    command:
      # appendonly: a job enqueued and then interrupted by the machine
      # restarting is retried rather than lost. Closing the laptop mid-ingest
      # is a normal Tuesday.
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  egress-proxy:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-egress-proxy"]
    environment:
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
    # The only service on both networks. It is therefore the only route out of
    # the stack, and it never forwards anything: in local mode there are no
    # allowed destinations and there is no configuration that would create one.
    networks: [internal, egress]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  inference-bridge:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-inference-bridge"]
    environment:
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-askwell}
      ASKWELL_INFERENCE_SOCKET: /run/askwell/inference.sock
      ASKWELL_INFERENCE_UPSTREAM_PORT: ${ASKWELL_INFERENCE_UPSTREAM_PORT:-8080}
      ASKWELL_EMBEDDING_PORT: ${ASKWELL_EMBEDDING_PORT:-8081}
      ASKWELL_RERANKER_PORT: ${ASKWELL_RERANKER_PORT:-8082}
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
    volumes:
      - ${ASKWELL_RUN_DIR:-./.run}:/run/askwell:z
    # The one container with host networking, and it is a real widening of the
    # claim above rather than a technicality.
    #
    # It exists because SELinux refuses `connectto` when a container_t process
    # dials a socket listened on by an unconfined_t one — the file label is
    # irrelevant, the listener's process label decides. The host supervisor is
    # unconfined, so the socket has to be owned by a container.
    #
    # Its entire program dials 127.0.0.1 and nothing else, which is a guarantee
    # you get by reading fifty lines rather than one the network enforces.
    # Everything that touches the user's material — api, worker, postgres,
    # redis — stays internal with no route out.
    network_mode: host
    restart: unless-stopped

  api:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-api"]
    environment:
      # askwell_app, NOT the owner. See deploy/postgres/10-roles.sh.
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      # Inside the container the API must listen on all interfaces to be
      # reachable at all. What keeps it off the network is the port publishing
      # below, which binds to loopback on the host. M0-STACK-SEC-012 proves it.
      ASKWELL_HOST: 0.0.0.0
      ASKWELL_PORT: "8000"
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_PROFILE: ${ASKWELL_PROFILE:-balanced}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
      ASKWELL_WEB_ASSETS_DIR: /app/web/out
      ASKWELL_INFERENCE_SOCKET: /run/askwell/inference.sock
      # The sandbox's own superuser, over its own network. Used only by
      # `askwell.sandbox`'s control plane to create and drop per-source
      # databases (C3) — never by anything that runs dump content. See
      # `deploy/sandbox/10-roles.sh`.
      ASKWELL_SANDBOX_DATABASE_URL: postgresql://${SANDBOX_POSTGRES_USER:-askwell_sandbox}:${SANDBOX_POSTGRES_PASSWORD:?set SANDBOX_POSTGRES_PASSWORD in .env}@sandbox:5432/postgres
      # `askwell_sandbox_owner`'s own password (M4-DUMP-ING-088) — read here
      # too, not just by the worker, since a future add-dump endpoint on the
      # API needs to build the same DSN to hand the worker a job.
      ASKWELL_SANDBOX_OWNER_PASSWORD: ${SANDBOX_OWNER_PASSWORD:?set SANDBOX_OWNER_PASSWORD in .env}
      # `askwell_sandbox_readonly`'s own password (M4-SCHEMA-ING-100) — schema
      # introspection against a sandbox database runs as this role, never the
      # owner above.
      ASKWELL_SANDBOX_READONLY_PASSWORD: ${SANDBOX_READONLY_PASSWORD:?set SANDBOX_READONLY_PASSWORD in .env}
      # Read here only to say how long a queue will take. The worker is what
      # honours it; both must agree or the estimate is arithmetic over a number
      # nothing is using.
      ASKWELL_INGEST_CONCURRENCY: ${ASKWELL_INGEST_CONCURRENCY:-2}
      # The window onto the user's own files. Empty means there is none yet,
      # which is the correct state on a fresh install — nominating a folder
      # then tells the user exactly what to set here.
      ASKWELL_ROOTS_MOUNT: ${ASKWELL_ROOTS_MOUNT:-}
      # Anything that respects these gets refused *with a log naming it*.
      # Anything that ignores them gets no route at all, because `internal`
      # has none — refused either way, but only the first way is diagnosable,
      # and a dependency phoning home is exactly the thing worth seeing.
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis,worker
      no_proxy: localhost,127.0.0.1,postgres,redis,worker
    volumes:
      # The socket the host-side inference supervisor listens on. Inference is
      # native so GPU acceleration works, and this network has no route off the
      # machine — so a socket file is what joins them, with no route involved in
      # either direction. See docs/decisions.md.
      - ${ASKWELL_RUN_DIR:-./.run}:/run/askwell:z
      # The built interface, read-only: the API serves these files and has no
      # reason to be able to change them.
      - ./web/out:/app/web/out:ro,z
      # The user's own files. Askwell indexes in place and copies nothing, so
      # the containers need a route to the folders being indexed — and this is
      # deliberately one narrow route rather than open filesystem access.
      #
      # Mounted at the *same absolute path* inside the container as outside.
      # That identity is load-bearing: `sources.root_path` and
      # `documents.path` hold host paths, which is what the user sees, what
      # the native picker returns in M7, and what a citation has to reopen. A
      # different mount point would need a translation layer in every one of
      # those places, and one missed translation is a file that cannot be
      # found for reasons nobody can see.
      #
      # Read-only, and without `z`. `z` relabels recursively — pointed at a
      # 40 GB tree of the user's own material that is slow, and it changes
      # SELinux labels on files Askwell has no business modifying. The cost is
      # that on an SELinux host the containers may be refused; that surfaces as
      # a root in the `unreadable` state naming SELinux, rather than as an
      # empty folder. Whether it does refuse is unverified — see BRAIN.md.
      #
      # Unset by default. Podman would otherwise have to invent a directory,
      # so the placeholder is an empty path under /tmp that exists to be inert:
      # no root can be nominated under it, so every root reports `not_mounted`
      # with the fix stated — which is exactly true on a fresh install.
      - ${ASKWELL_ROOTS_MOUNT:-/tmp/askwell-no-roots-mount}:${ASKWELL_ROOTS_MOUNT:-/tmp/askwell-no-roots-mount}:ro
    # `sandbox` in addition to `internal`, not instead of it — the API still
    # needs Postgres, Redis and the proxy. Not a `depends_on` on `sandbox`:
    # the sandbox failing to start must not stop the API from starting,
    # because document sources have to keep working regardless
    # (`docs/data-sources.md` §3's edge case). `askwell.health` reports it
    # separately instead.
    networks: [internal, sandbox]
    ports:
      # 127.0.0.1 is load-bearing, not decoration. "8000:8000" would publish on
      # every interface, putting the user's entire corpus on whatever café
      # network they are on.
      - "127.0.0.1:${ASKWELL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-worker"]
    environment:
      # askwell_app, NOT the owner. See deploy/postgres/10-roles.sh.
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      ASKWELL_INFERENCE_SOCKET: /run/askwell/inference.sock
      # See the api service — same control-plane connection, same reasoning.
      # The worker is what reclaims an orphaned sandbox database at startup.
      ASKWELL_SANDBOX_DATABASE_URL: postgresql://${SANDBOX_POSTGRES_USER:-askwell_sandbox}:${SANDBOX_POSTGRES_PASSWORD:?set SANDBOX_POSTGRES_PASSWORD in .env}@sandbox:5432/postgres
      # `askwell_sandbox_owner`'s own password (M4-DUMP-ING-088) — the worker
      # is what actually runs a dump's content, as this role, never the
      # superuser above.
      ASKWELL_SANDBOX_OWNER_PASSWORD: ${SANDBOX_OWNER_PASSWORD:?set SANDBOX_OWNER_PASSWORD in .env}
      # `askwell_sandbox_readonly`'s own password (M4-SCHEMA-ING-100) — the
      # worker is what actually introspects a sandbox database's schema, as
      # this role, never the owner above.
      ASKWELL_SANDBOX_READONLY_PASSWORD: ${SANDBOX_READONLY_PASSWORD:?set SANDBOX_READONLY_PASSWORD in .env}
      # The worker is what actually reads and indexes the files, so it needs
      # the same window as the API and on the same terms. See the api service.
      ASKWELL_ROOTS_MOUNT: ${ASKWELL_ROOTS_MOUNT:-}
      # How many files are indexed at once. The ceiling exists because this
      # machine is also running the user's browser.
      ASKWELL_INGEST_CONCURRENCY: ${ASKWELL_INGEST_CONCURRENCY:-2}
      ASKWELL_INGEST_JOB_TIMEOUT_SECONDS: ${ASKWELL_INGEST_JOB_TIMEOUT_SECONDS:-3600}
      ASKWELL_INGEST_RECONCILE_SECONDS: ${ASKWELL_INGEST_RECONCILE_SECONDS:-30}
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis
      no_proxy: localhost,127.0.0.1,postgres,redis
    volumes:
      - ${ASKWELL_RUN_DIR:-./.run}:/run/askwell:z
      - ${ASKWELL_ROOTS_MOUNT:-/tmp/askwell-no-roots-mount}:${ASKWELL_ROOTS_MOUNT:-/tmp/askwell-no-roots-mount}:ro
    # See the api service.
    networks: [internal, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  # No route off this machine. Not a firewall rule that could be relaxed by
  # accident — an absence of routing, which is the strongest form of "no" a
  # container network has.
  internal:
    internal: true

  # The proxy alone. Its only purpose is to exist so that the proxy has
  # somewhere to refuse *to*.
  egress: {}

  # `sandbox` alone, plus `api` and `worker`. Not `internal`: an imported dump
  # is untrusted code, and this is what keeps the database it loads into from
  # ever reaching Postgres, Redis or the proxy, in either direction — an
  # absence of routing rather than a rule (C3).
  sandbox:
    internal: true

volumes:
  # Named, so `podman compose down` keeps them. The user closes the lid and
  # reopens it the next day; their sources and conversations are still there.
  postgres-data:
  redis-data:
  # Separate from postgres-data so a runaway import fills only this one
  # (`docs/data-sources.md` §3's cap, `M4-DUMP-VAL-089`, is what bounds it —
  # this is what makes bounding it possible without touching the main volume).
  sandbox-data:
