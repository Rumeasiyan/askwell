# Askwell — the local stack.
#
# One user, one machine. There is no operator, no second node and no
# orchestrator: this runs on somebody's laptop, which is also running their
# browser. Every service here is something a non-technical person has to have
# working unaided, which is why the API reports each of them separately rather
# than as one boolean (see api/src/askwell/health.py).
#
#   podman compose up -d          bring it up
#   podman compose logs -f api    watch one service
#   podman compose down           stop, keeping data
#   podman compose down -v        stop and destroy the data. There is no undo.
#
# Not here yet, deliberately: the sandbox database for untrusted dumps (M4, C3),
# voice (M6), and native inference, which runs as a host process rather than a
# container because it needs the GPU.
#
# C1 is enforced by the network topology, not by asking nicely. Every service
# except the proxy sits on an `internal` network, which has no route off this
# machine — so a container that ignores HTTP_PROXY does not find another way
# out, it finds nothing. The proxy is the only service on both networks, and it
# refuses everything.

name: askwell

services:
  postgres:
    # pgvector's own image, which is Postgres with the extension already built.
    # Building it into the stock image would mean a compiler in the runtime
    # image and a build step on every user's machine.
    image: docker.io/pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and set it. It is never committed (C8).}
      POSTGRES_DB: ${POSTGRES_DB:-askwell}
      # Askwell's own data lives in a subdirectory of the volume so that the
      # volume can also hold anything else the database needs later without
      # Postgres refusing to initialise into a non-empty directory.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Read by the initialisation hook below, not by Postgres itself.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is not set. Copy .env.example to .env and set it (C8).}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-${POSTGRES_APP_PASSWORD}}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, and creates the two non-owner
      # roles. Askwell must not connect as the table owner: an owner bypasses
      # its own grants, which would leave the audit log's append-only guarantee
      # looking correct and doing nothing (C6).
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # -U and -d matter: the default `pg_isready` asks about a database named
      # after the current user, which reports healthy while the database the
      # application actually connects to is still being created on first boot.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askwell} -d ${POSTGRES_DB:-askwell}"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Postgres restarts itself once during first-boot initialisation, and
      # accepts connections briefly in between. Without a start period the
      # dependents connect into that window and are dropped.
      start_period: 10s
    # No ports. Nothing outside the stack talks to the database, and publishing
    # it would put an open Postgres on the machine's network interface.
    networks: [internal]
    restart: unless-stopped

  redis:
    image: docker.io/redis:8-alpine
    command:
      # appendonly: a job enqueued and then interrupted by the machine
      # restarting is retried rather than lost. Closing the laptop mid-ingest
      # is a normal Tuesday.
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  egress-proxy:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-egress-proxy"]
    environment:
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
    # The only service on both networks. It is therefore the only route out of
    # the stack, and it never forwards anything: in local mode there are no
    # allowed destinations and there is no configuration that would create one.
    networks: [internal, egress]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-api"]
    environment:
      # askwell_app, NOT the owner. See deploy/postgres/10-roles.sh.
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      # Inside the container the API must listen on all interfaces to be
      # reachable at all. What keeps it off the network is the port publishing
      # below, which binds to loopback on the host. M0-STACK-SEC-012 proves it.
      ASKWELL_HOST: 0.0.0.0
      ASKWELL_PORT: "8000"
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_PROFILE: ${ASKWELL_PROFILE:-balanced}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
      ASKWELL_WEB_ASSETS_DIR: /app/web/out
      # Anything that respects these gets refused *with a log naming it*.
      # Anything that ignores them gets no route at all, because `internal`
      # has none — refused either way, but only the first way is diagnosable,
      # and a dependency phoning home is exactly the thing worth seeing.
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis,worker
      no_proxy: localhost,127.0.0.1,postgres,redis,worker
    volumes:
      # The built interface, read-only: the API serves these files and has no
      # reason to be able to change them.
      - ./web/out:/app/web/out:ro,z
    networks: [internal]
    ports:
      # 127.0.0.1 is load-bearing, not decoration. "8000:8000" would publish on
      # every interface, putting the user's entire corpus on whatever café
      # network they are on.
      - "127.0.0.1:${ASKWELL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: localhost/askwell-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["askwell-worker"]
    environment:
      # askwell_app, NOT the owner. See deploy/postgres/10-roles.sh.
      ASKWELL_DATABASE_URL: postgresql://askwell_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-askwell}
      ASKWELL_REDIS_HOST: redis
      ASKWELL_ENVIRONMENT: ${ASKWELL_ENVIRONMENT:-development}
      ASKWELL_LOG_LEVEL: ${ASKWELL_LOG_LEVEL:-INFO}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis
      no_proxy: localhost,127.0.0.1,postgres,redis
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  # No route off this machine. Not a firewall rule that could be relaxed by
  # accident — an absence of routing, which is the strongest form of "no" a
  # container network has.
  internal:
    internal: true

  # The proxy alone. Its only purpose is to exist so that the proxy has
  # somewhere to refuse *to*.
  egress: {}

volumes:
  # Named, so `podman compose down` keeps them. The user closes the lid and
  # reopens it the next day; their sources and conversations are still there.
  postgres-data:
  redis-data:
