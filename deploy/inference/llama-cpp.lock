# The llama.cpp builds a release bundles, pinned. M10-FIX-DEPLOY-222.
#
# Read by scripts/fetch-llama-cpp.sh, which the release workflow runs; nothing
# reads this at run time and nothing is fetched on a user's machine (C1).
# Every archive is the project's own published release asset for `tag`,
# checked against the sha256 below before it is unpacked. The digests are
# GitHub's release metadata for that tag, re-computed from the downloaded
# files on 2026-09-30.
#
# `gpu` is the Vulkan build on Linux and Windows (NVIDIA, AMD and Intel from
# one binary) and the Metal build on Apple silicon; `cpu` is the
# processor-only build, which the supervisor runs when the GPU build lists no
# device it can use or fails to load the model (docs/decisions.md,
# 2026-09-30). macOS needs no `cpu` build: every Apple-silicon Mac has Metal.
#
# C9: llama.cpp is MIT (github.com/ggml-org/llama.cpp, SPDX `MIT`, and the
# LICENSE at this tag, sha256 below). The Windows archives carry no copy of
# that LICENSE, so it is fetched from the tag and placed beside each build.
# They also carry libomp.dll, LLVM's OpenMP runtime, under Apache-2.0 WITH
# LLVM-exception, with its own LICENSE-LLVM-OpenMP inside the archive.
#
# To move to a newer build: change `tag`, then every asset name and digest,
# from `gh api repos/ggml-org/llama.cpp/releases/tags/<tag>`, and re-measure
# docs/decisions.md's numbers on a machine with a graphics card.

