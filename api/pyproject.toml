[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askwell"
description = "Personal AI over your own files and databases."
license = "Apache-2.0"
requires-python = "==3.12.*"
dynamic = ["version"]
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pypdfium2>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
askwell-api = "askwell.app:main"
askwell-worker = "askwell.worker:main"
askwell-verify = "askwell.audit:main"
askwell-egress-proxy = "askwell.egress:main"
askwell-inference-bridge = "askwell.inference.bridge:main"

[dependency-groups]
# Toolchain only. Runtime dependencies arrive with the code that needs them.
# Constraints live here; the exact pins live in uv.lock, which is what the
# build installs. Widening a bound here does not change any build until the
# lock is regenerated deliberately.
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# The version is not declared here. It is read from the repository's VERSION
# file by hatch_build.py, so there is exactly one place to change it.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/askwell"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids a function call in an argument default, because the call happens
# once at definition time rather than per call — which is a real bug for
# `list()` and a mutable default. FastAPI's `Depends` is built on exactly that
# behaviour: the object in the default *is* the declaration, read once by the
# framework. Flagging it means either four suppressions per router or writing
# dependency injection the framework does not support.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "UP",        # pyupgrade
    "ASYNC",     # blocking calls in async code
    "T20",       # flake8-print: C6/conventions forbid print(), logging is structured
    "RUF",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]
# An untyped dependency should be a decision, not a silent hole.
disallow_any_unimported = true
warn_unreachable = true

# pypdfium2 ships no stubs and no `py.typed` marker. Ignored rather than typed
# stub-by-hand for one library used at one boundary — `askwell/extract_pdf.py`
# casts every value it takes back out of pdfium, so the untyped surface is
# exactly the one function that touches the library and nowhere else.
[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true

# Same reasoning, same shape, for M1-EXTRACT-ING-027's four new extractors:
# none of python-docx, python-pptx, openpyxl or bs4 ships stubs, and each is
# touched at exactly one module boundary that casts its way back to typed
# values immediately.
[[tool.mypy.overrides]]
module = ["docx", "docx.*", "pptx", "pptx.*", "openpyxl", "openpyxl.*", "bs4"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Database-backed tests are deselected by default because the default run has
# no network at all (C1, see scripts/dev.sh). They are not skipped silently:
# `scripts/dev.sh test-db` selects them and fails if the database is not there.
addopts = "-q --strict-markers --strict-config -m 'not requires_db'"
asyncio_mode = "auto"
markers = [
    "requires_db: needs a live Postgres with the migration applied. Run with scripts/dev.sh test-db.",
]
