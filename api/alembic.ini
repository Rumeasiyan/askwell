# Alembic. Run through scripts/dev.sh, never directly on the host.
#
# The database URL is deliberately absent: it carries a password, so it comes
# from ASKWELL_DATABASE_URL at runtime (C8). A URL here would be committed.

[alembic]
script_location = src/askwell/db/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

# Revision ids are dated, so `ls versions/` reads in the order they applied
# rather than in the order of random hex.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
