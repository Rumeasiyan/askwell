<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Askwell</title>
    <!--
      Askwell's own starting state, per `docs/states-and-edge-cases.md` §1
      ("Model still downloading" / first-launch pattern) and this ticket's
      edge case: the API is not up yet when the window opens, so the window
      must show Askwell's own message rather than the webview's own
      connection-refused page, and recover on its own once the API answers.

      This file is bundled into the shell binary (`build.frontendDist`) and
      loads with no network dependency at all — no font, no CDN, nothing but
      this document. It never renders retrieved or remote content, so it
      carries none of the C7 concerns the rest of the app does.

      `M7-TAURI-DEPLOY-183` adds the third distinct unavailability cause: the
      container runtime missing/not running, or the stack itself never
      coming up — the two failures that mean no API ever answers, so this
      page is the only surface that can ever say so. `web/src-tauri/src/
      supervisor.rs` pushes that in directly via `WebviewWindow::eval`
      (`window.askwellReportCause`) rather than a Tauri command: this page is
      the shell's own bundled asset, not retrieved content, so there is no
      IPC surface to add just for a read-only status line. A model that
      fails to load once the stack *is* up is a different, already-existing
      cause (`M0-MODEL-BE-020`) reported by the real application after
      hand-off, not by this page.
    -->
    <style>
      :root {
        --paper: #e9ebe7;
        --ink: #232722;
        --muted: #5f655e;
        --provenance: #2f6b62;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #191c1a;
          --ink: #e4e7e1;
          --muted: #9aa096;
          --provenance: #5fa99b;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 0 1.5rem;
      }
      .mark {
        width: 2.5rem;
        height: 2px;
        background: var(--provenance);
        margin: 0 auto 1.25rem;
        position: relative;
      }
      .mark::after {
        content: "";
        position: absolute;
        right: -0.4rem;
        top: -0.3rem;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--provenance);
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.35rem;
      }
      p {
        font-size: 0.875rem;
        color: var(--muted);
        margin: 0;
      }
      button#repair {
        display: none;
        margin-top: 1rem;
        font: inherit;
        font-size: 0.8rem;
        padding: 0.4rem 0.9rem;
        border-radius: 0.4rem;
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button#repair:hover {
        border-color: var(--provenance);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1 id="headline">Starting Askwell</h1>
      <p id="detail">Waiting for the local application to come up.</p>
      <!--
        `M7-PACK-FE-143`: shown only once a real cause has been reported
        (below) — before that, this is the ordinary few-seconds cold start
        and a repair button would invite action on nothing wrong.
      -->
      <button id="repair" type="button">Open Supervision…</button>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var apiOrigin = params.get("api") || "http://127.0.0.1:8000";
        var headline = document.getElementById("headline");
        var detail = document.getElementById("detail");
        var attempt = 0;
        // Once the shell has told us *why* nothing is coming up, that
        // explanation stays on screen — the generic "still starting" text
        // below must not overwrite a real, named cause with a vaguer one.
        var reportedCause = null;
        var repairButton = document.getElementById("repair");

        repairButton.addEventListener("click", function () {
          if (window.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__.invoke("open_supervision_window").catch(function () {
              /* nothing more useful to do here than leave the button visible */
            });
          }
        });

        // Called by `web/src-tauri/src/supervisor.rs` via `WebviewWindow::eval`
        // whenever the shell-level cause changes: the container runtime
        // missing or not running, or the stack itself failing after
        // exhausting its restart backoff. Both mean no API will ever answer
        // here, so `poll()` below would otherwise spin forever with no
        // explanation.
        window.askwellReportCause = function (payload) {
          if (!payload || !payload.cause) return;
          reportedCause = payload.cause;
          if (payload.cause === "runtime_missing") {
            headline.textContent = "Podman isn't available";
            detail.textContent =
              payload.detail ||
              "Askwell needs Podman to run its container stack. Install or start it, then reopen Askwell.";
            repairButton.style.display = "inline-block";
          } else if (payload.cause === "stack_down") {
            headline.textContent = "The container stack couldn't start";
            detail.textContent =
              payload.detail || "Check Podman and try reopening Askwell.";
            repairButton.style.display = "inline-block";
          } else {
            // "starting" or "ready" — back to the ordinary starting copy.
            reportedCause = null;
            headline.textContent = "Starting Askwell";
            detail.textContent = "Waiting for the local application to come up.";
            repairButton.style.display = "none";
          }
        };

        function poll() {
          attempt += 1;
          fetch(apiOrigin + "/health", { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) throw new Error("not ready");
              return response.json();
            })
            .then(function () {
              // The health probe answering is what "up" means here; the
              // window now hands off to the real application entirely —
              // this page's job is done and it is never seen again until
              // the next cold start.
              window.location.replace(apiOrigin + "/");
            })
            .catch(function () {
              if (attempt > 3 && !reportedCause) {
                headline.textContent = "Still starting Askwell";
                detail.textContent =
                  "This is taking longer than usual. It will open as soon as the application answers.";
              }
              window.setTimeout(poll, 750);
            });
        }

        poll();
      })();
    </script>
  </body>
</html>
