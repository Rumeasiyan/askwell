[package]
name = "askwell-shell"
# Not the product version — see build.rs. Cargo requires *a* value here, but
# nothing reads it; the real value comes from the repo-root VERSION file
# (AGENTS.md §7: one canonical version, never re-typed).
version = "0.0.0"
description = "Askwell desktop shell — a window over the local API, nothing more"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
ureq = { version = "3.4.2", default-features = false }

# `supervisor.rs` sends SIGTERM to the inference process on shutdown so its
# own child (llama-server) gets a chance to stop cleanly — `std::process::Child`
# only exposes a hard kill. Unix-only: Windows has no SIGTERM equivalent, and
# the Python supervisor's own signal handling is already a no-op there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
